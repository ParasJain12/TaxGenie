<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80DD Tax Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #355efc 0%, #ACB6E5 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            border-left: 5px solid #355efc;
        }

        h1 {
            font-size: 1.5rem;
            color: #355efc;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
            font-size: 0.95rem;
            display: block;
        }

        input[type="text"],
        input[type="checkbox"],
        select {
            padding: 10px 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #355efc;
            box-shadow: 0px 0px 5px rgba(53, 94, 252, 0.2);
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        button {
            padding: 12px 0;
            background-color: #355efc;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            text-align: center;
            width: 100%;
        }

        button:hover {
            background-color: #2a5298;
            transform: translateY(-2px);
        }

        .result-section {
            margin-top: 30px;
        }

        .result-box {
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
            text-align: left;
            margin-top: 15px;
            border: 1px solid #ccc;
        }

        .result-box p {
            font-size: 1.1rem;
            color: #333;
            margin: 0;
        }

        .result-box p span {
            color: #355efc;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #355efc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #2a5298;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>80DD Calculator</h1>
        <form th:action="@{/eightyDD-calculator}" th:object="${eightyDDCalculator}" method="post">
            <label for="dependentMedicalExpenses">Dependent Medical Expenses:</label>
            <input type="text" id="dependentMedicalExpenses" th:field="*{dependentMedicalExpenses}" placeholder="Enter amount" />

            <label for="severeDisability">
                <input type="checkbox" id="severeDisability" th:field="*{severeDisability}" />
                Severe Disability
            </label>

            <button type="submit">Calculate</button>
        </form>

        <div class="result-section">
            <h1>80DD Result</h1>
            <div class="result-box">
                <p>Your Deduction is: <span th:text="${deduction}"></span></p>
            </div>
        </div>
        <a href="/eightyDD-calculator" class="back-link">Back to Calculator</a>
    </div>
</body>
</html>
