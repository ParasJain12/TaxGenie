<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Financial News</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background-color: #fff;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            transition: transform 0.3s;
        }
        li:hover {
            transform: translateY(-10px);
        }
        h2 {
            color: #007BFF;
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
        }
        strong {
            color: #000;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Latest Financial News</h1>
    <ul>
        <li th:each="article : ${articles}">
            <h2 th:text="${article.title}">Title</h2>
            <p th:text="${article.description}">Description</p>
            <p><strong>Source:</strong> <span th:text="${article.source}">Source</span></p>
            <p><strong>Published at:</strong> <span th:text="${article.publishedAt}">Date</span></p>
            <a th:href="${article.url}" target="_blank">Read more</a>
        </li>
    </ul>
    <!-- Footer -->
    <footer>
        <p>&copy; 2024 TaxGenie. All rights reserved.</p>
    </footer>
</body>
</html>
