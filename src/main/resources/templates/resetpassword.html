<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>TaxGenie - Reset Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="../static/css/style.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Reset Password 🔒</h2>
            <p class="text-muted">Enter your new password below.</p>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger text-center py-2" th:text="${error}"></div>

        <form th:action="@{/resetpassword}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-lock"></i></span>
                    <input type="password" name="password" id="newPassword" required
                           class="form-control form-control-lg"
                           placeholder="Enter new password">
                    <span class="input-group-text" style="cursor:pointer;"
                          onclick="document.getElementById('newPassword').type === 'password' ?
                              document.getElementById('newPassword').type = 'text' :
                              document.getElementById('newPassword').type = 'password'">
                            <i class="fa fa-eye"></i>
                        </span>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                    Reset Password
                </button>
            </div>
        </form>

    </div>
</div>

</body>
</html>
