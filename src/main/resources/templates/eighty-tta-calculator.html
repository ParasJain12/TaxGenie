<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80TTA Tax Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #355efc 0%, #ACB6E5 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            border-left: 5px solid #355efc;
        }

        h1 {
            font-size: 1.8rem;
            color: #355efc;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 1rem;
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input[type="text"] {
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 10px;
            padding-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input[type="text"]:focus {
            border-color: #355efc;
            box-shadow: 0px 0px 5px rgba(53, 94, 252, 0.2);
        }

        .input-group input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
            opacity: 0.85;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .input-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #355efc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.3s;
        }

        .input-group input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #355efc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.3s;
        }

        .input-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        button {
            padding: 12px 0;
            background-color: #355efc;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            text-align: center;
            width: 100%;
        }

        button:hover {
            background-color: #2a5298;
            transform: translateY(-2px);
        }

        .result-section {
            margin-top: 30px;
        }

        .result-box {
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #ccc;
        }

        .result-box p {
            font-size: 1.2rem;
            color: #333;
            margin: 0;
        }

        .result-box p span {
            color: #355efc;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #355efc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #2a5298;
        }
    </style>
    <script>
        function updateInterestIncome(val) {
            document.getElementById('interestIncome').value = val;
        }

        function updateInterestSlider(val) {
            document.getElementById('interestIncomeSlider').value = val;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>80TTA Calculator</h1>
        <form th:action="@{/eighty-tta-calculator}" th:object="${eightyTTACalculator}" method="post">
            <label for="interestIncome">Interest Income:</label>
            <div class="input-group">
                <input type="text" id="interestIncome" th:field="*{interestIncome}" placeholder="Enter amount" oninput="updateInterestSlider(this.value)" />
                <input type="range" id="interestIncomeSlider" name="interestIncomeSlider" min="0" max="100000" step="1000" value="50000" oninput="updateInterestIncome(this.value)" aria-label="Slide to select your interest income">
            </div>

            <button type="submit">Calculate</button>
        </form>

        <div class="result-section">
            <h1>80TTA Result</h1>
            <div class="result-box">
                <p>Your eligible deduction under Section 80TTA is: <span th:text="${deduction}"></span></p>
            </div>
        </div>
    </div>
</body>
</html>
