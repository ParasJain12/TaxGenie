<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #355efc 0%, #ACB6E5 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 15px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 20px;
            text-align: left;
            font-weight: 600;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 1rem;
            display: block;
        }

        input[type="text"],
        select {
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #355efc;
            box-shadow: 0px 0px 10px rgba(53, 94, 252, 0.2);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
            opacity: 0.85;
            margin-bottom: 5px;
            transition: opacity 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #355efc;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #355efc;
            border-radius: 50%;
            cursor: pointer;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }

        button {
            padding: 12px 0;
            background-color: #355efc;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            text-align: center;
            width: 100%;
        }

        button:hover {
            background-color: #2a5298;
            transform: translateY(-2px);
            box-shadow: 0px 10px 20px rgba(42, 82, 152, 0.2);
        }

        .result-section {
            margin-top: 30px;
            text-align: center; /* Center-aligns the "Compound Interest Result" heading */
        }

        .result-section h1 {
            margin-bottom: 20px;
        }

        .result-box {
            padding: 20px;
            background-color: #f8faff;
            border-radius: 12px;
            border: 2px solid #355efc;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.05);
            text-align: left; /* Left-aligns the "The Compound Interest is:" text */
            margin-top: 10px;
        }

        .result-box p {
            font-size: 1.2rem;
            color: #444;
            margin: 0;
        }

        .result-box p span {
            color: #355efc;
            font-weight: bold;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Compound Interest Calculator</h1>
        <form th:action="@{/compound-interest-calculator}" th:object="${compoundInterestCalculator}" method="post">
            <label for="principal">Principal Amount</label>
            <input type="text" id="principal" th:field="*{principal}" oninput="updateSliderValue(this.value)" />
            <input type="range" id="principalSlider" name="principalSlider" min="1000" max="10000000" step="1000" value="50000" oninput="updatePrincipalValue(this.value)" aria-label="Slide to select your principal amount">
            <div class="range-labels">
                <span>₹ 1K</span>
                <span>₹ 10M</span>
            </div>

            <label for="rate">Rate of Interest (%)</label>
            <input type="text" id="rate" th:field="*{rate}" oninput="updateRateSlider(this.value)" />
            <input type="range" id="rateSlider" name="rateSlider" min="1" max="50" value="6" oninput="updateRateValue(this.value)" aria-label="Slide to select your interest rate">
            <div class="range-labels">
                <span>1%</span>
                <span>50%</span>
            </div>

            <label for="time">Time (years)</label>
            <input type="text" id="time" th:field="*{time}" />

            <label for="timesCompounded">Times Compounded per Year</label>
            <input type="text" id="timesCompounded" th:field="*{timesCompounded}" />

            <button type="submit">Calculate</button>
        </form>

        <div class="result-section">
            <h1>Compound Interest Result</h1>
            <div class="result-box">
                <p>The Compound Interest is: <span th:text="${compoundInterest}"></span></p>
            </div>
        </div>
    </div>
</body>
</html>
