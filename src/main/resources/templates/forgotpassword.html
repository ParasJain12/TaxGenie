<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>TaxGenie - Forgot Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="../static/css/style.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Forgot Password 🔑</h2>
            <p class="text-muted">Enter your registered email and we'll send you a reset link.</p>
        </div>

        <!-- Success Message -->
        <div th:if="${success}" class="alert alert-success text-center py-2" th:text="${success}"></div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger text-center py-2" th:text="${error}"></div>

        <form th:action="@{/forgotpassword}" method="post">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                    <input type="email" name="email" required
                           class="form-control form-control-lg"
                           placeholder="Enter your registered email">
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                    Send Reset Link
                </button>
            </div>

            <div class="text-center">
                <a th:href="@{/login}" class="text-primary">← Back to Login</a>
            </div>
        </form>

    </div>
</div>

</body>
</html>
