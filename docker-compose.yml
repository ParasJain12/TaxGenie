version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mysql-taxgenie
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taxgenie
      MYSQL_USER: taxuser
      MYSQL_PASSWORD: taxpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utaxuser", "-ptaxpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: taxgenie
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/taxgenie
      SPRING_DATASOURCE_USERNAME: taxuser
      SPRING_DATASOURCE_PASSWORD: taxpass

volumes:
  mysql_data:
